# Development stack:  cp .env.example .env && docker compose up --build
# Two networks: the internet-facing tier (edge) has no route to data (internal).
name: civicpulse

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
  REDIS_URL: redis://cache:6379/0
  TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-rules}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OLLAMA_BASE_URL: http://ollama:11434/v1
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-10}
  RATE_LIMIT_WINDOW_S: ${RATE_LIMIT_WINDOW_S:-60}

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # One-shot: schema + idempotent seed. The app itself never creates tables.
  migrate:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment: *backend-env
    depends_on:
      database: { condition: service_healthy }
      cache: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  backend:
    build: ./backend
    # Dev only: hot reload from the bind mount below.
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: *backend-env
    volumes:
      # Dev-only bind mount for hot reload. Absent from compose.prod.yaml, where the
      # image must be exactly what CI built and scanned.
      - ./backend/app:/app/app:ro
    ports:
      - "8000:8000"
    # The only service on both networks: edge for the frontend and the LLM API,
    # internal for Postgres and Redis.
    networks: [edge, internal]
    depends_on:
      database: { condition: service_healthy }
      cache: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  frontend:
    build: ./frontend
    # edge ONLY: the internet-facing tier has no route to the database or cache.
    #   docker compose exec frontend ping -c 1 database   -> fails: bad address 'database'
    networks: [edge]
    ports:
      - "3000:8080"   # http://localhost:3000 (8080 is left free for the k3d ingress)
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # Offline triage path. Opt in with:  docker compose --profile ollama up
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    networks: [edge]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true   # no route to the outside world

volumes:
  pgdata:          # PostgreSQL data directory: the durable one
  redisdata:       # Redis AOF: keeps rate-limit windows and triage cache across restarts
  ollama_models:   # model weights, so ~800 MB is not re-pulled on every up
