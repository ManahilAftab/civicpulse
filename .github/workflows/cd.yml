name: cd

on:
  push:
    branches: [main]

# Least privilege: read the repo, write packages (GHCR). Nothing else.
permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/manahilaftab/civicpulse-backend

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    env:
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest   # the full suite again, on the merged result

  build-push:
    runs-on: ubuntu-24.04
    needs: [test]   # never publish from code we already know is broken
    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR with the scoped, auto-expiring GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend (tagged by commit SHA, plus latest)
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.BACKEND_IMAGE }}@${{ steps.backend.outputs.digest }}
          format: spdx-json
          output-file: backend-sbom.spdx.json
      - name: Record what was published
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- backend: \`${BACKEND_IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`${{ steps.backend.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
      # Partner B: add the frontend image build here, same pattern.

  smoke-deploy:
    # Deploy by immutable reference: the SHA just pushed, never :latest.
    runs-on: ubuntu-24.04
    needs: [build-push]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the prod stack from the published image
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' .env
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${GITHUB_SHA}/" .env
          docker compose -f compose.prod.yaml up -d
      - name: Wait for readiness and smoke-test
        run: |
          cid=$(docker compose -f compose.prod.yaml ps -q backend)
          for i in $(seq 1 60); do
            if docker exec "$cid" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"; then
              docker exec "$cid" python -c "import urllib.request,json; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/stats')); assert d['total']>=30, d; print('smoke ok, total =', d['total'])"
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.prod.yaml logs; exit 1
      - name: Tear down
        if: always()
        run: docker compose -f compose.prod.yaml down -v
      # Partner B: replace/extend with the kind cluster deploy (kubectl apply -k k8s/overlays/prod,
      # rollout status, smoke test through the Ingress, kubectl get hpa).
