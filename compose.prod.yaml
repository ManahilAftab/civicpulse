# Deploy stack: prebuilt images only (no build:), pinned to a commit SHA.
#   IMAGE_TAG=<git sha> docker compose -f compose.prod.yaml up -d
name: civicpulse-prod

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
  REDIS_URL: redis://cache:6379/0
  TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-rules}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-10}
  RATE_LIMIT_WINDOW_S: ${RATE_LIMIT_WINDOW_S:-60}

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]          # no published port
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    networks: [internal]          # no published port
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  migrate:
    image: ghcr.io/manahilaftab/civicpulse-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment: *backend-env
    depends_on:
      database: { condition: service_healthy }
      cache: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  backend:
    image: ghcr.io/manahilaftab/civicpulse-backend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    environment: *backend-env
    networks: [edge, internal]
    depends_on:
      cache: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  frontend:
    image: ghcr.io/manahilaftab/civicpulse-frontend:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    networks: [edge]          # never on internal
    ports:
      - "80:8080"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

networks:
  edge: { driver: bridge }
  internal: { driver: bridge, internal: true }

volumes:
  pgdata:
  redisdata:
