# PLACEHOLDERS ONLY. Real values are created at deploy time, never committed:
#   kubectl -n civicpulse create secret generic civicpulse-secrets \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=DATABASE_URL=postgresql+psycopg://civicpulse:...@postgres:5432/civicpulse \
#     --from-literal=GROQ_API_KEY=... --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_ME
  DATABASE_URL: postgresql+psycopg://civicpulse:REPLACE_ME@postgres:5432/civicpulse
  GROQ_API_KEY: ""
